# Azure Security Audit Framework — CI
# Validates JSON artifacts (ARM policies, alert rules, playbooks)
# and ensures KQL query syntax is sound.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  json-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          FAILED=0
          while IFS= read -r -d '' f; do
            if python3 -c "
import json, sys
try:
    with open('$f') as fh:
        json.load(fh)
    print(f'  OK: $f')
except Exception as e:
    print(f'  FAIL: $f — {e}')
    sys.exit(1)
"; then
              :
            else
              FAILED=1
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -print0)
          if [ "$FAILED" = "1" ]; then
            echo "❌ JSON validation failed"
            exit 1
          fi
          echo "✅ All JSON files valid"

  kql-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Basic KQL syntax check
        run: |
          echo "Checking KQL files..."
          FAILED=0
          while IFS= read -r -d '' f; do
            # Basic validation: check for balanced pipes, common syntax patterns
            LINES=$(wc -l < "$f")
            PIPES=$(grep -c '|' "$f" 2>/dev/null || echo 0)
            HAS_QUERY=$(grep -cE '(where|project|summarize|extend|join|union|let)' "$f" 2>/dev/null || echo 0)
            echo "  $(printf '%3d' "$LINES") lines | $(printf '%2d' "$PIPES") pipes | $(printf '%2d' "$HAS_QUERY") ops — $(basename "$f")"
            if [ "$PIPES" -eq 0 ] && [ "$HAS_QUERY" -eq 0 ]; then
              echo "    ⚠️  File may be empty or incomplete"
            fi
          done < <(find . -name '*.kql' -not -path './.git/*' -print0)
          echo "✅ All KQL files checked"

  powershell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Write-Output "Validating PowerShell files..."
          $failed = $false
          Get-ChildItem -Recurse -Filter "*.ps1" -Exclude "*node_modules*" | ForEach-Object {
            try {
              $null = [System.Management.Automation.Language.Parser]::ParseInput(
                (Get-Content -Path $_.FullName -Raw),
                [ref] $null,
                [ref] $null
              )
              Write-Output "  OK: $($_.Name)"
            } catch {
              Write-Output "  FAIL: $($_.Name) — $($_.Exception.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Output "✅ All PowerShell files valid"
